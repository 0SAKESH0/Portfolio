name: Update LeetCode Stats

on:
  schedule:
    # Runs once every day at 12:00 AM UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leetcode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch LeetCode stats
        run: |
          curl -f "https://alfa-leetcode-api.onrender.com/SAKESH007/solved" \
          -o leetcode-api-response.json

      - name: Update JSON
        run: |
          node <<'EOF'
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync('leetcode-api-response.json', 'utf8')
          );

          const stats = {
            solved: data.solvedProblem,
            easy: data.easySolved,
            medium: data.mediumSolved,
            hard: data.hardSolved,
            updated: new Date().toISOString()
          };

          fs.writeFileSync(
            'assets/config/leetcode-stats.json',
            JSON.stringify(stats, null, 2) + '\n'
          );

          console.log('Updated LeetCode stats:', stats);
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/config/leetcode-stats.json

          git diff --cached --quiet || git commit -m "Update LeetCode stats"

      - name: Push changes
        run: |
          git push